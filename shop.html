<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Perfume Paragon</title>
<meta name="description" content="Browse all Perfume Paragon fragrances: men's, women's, unisex, luxury extraits and gift sets.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230e0c0a'/%3E%3Cpath d='M12 3l8 9-8 9-8-9z' fill='none' stroke='%23b08d3c' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body data-page="shop">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span id="shopCrumb" aria-current="page">All Fragrances</span></nav>
    <div class="page-head">
      <h1 class="h2" id="shopTitle">All Fragrances</h1>
      <p id="shopDesc"></p>
    </div>

    <div class="shop-layout">
      <aside class="filters" id="filterPanel" aria-label="Filters">
        <div class="filter-head"><span class="drawer-title">Filters</span><button type="button" class="icon-btn" id="filterClose" aria-label="Close filters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
        <div class="filter-body">
          <form id="shopSearchForm" class="shop-search" role="search">
            <input id="shopSearch" type="search" placeholder="Search fragrances" aria-label="Search fragrances" autocomplete="off">
            <button type="submit" aria-label="Search">Go</button>
          </form>
          <div class="filter-group"><h3>Collection</h3><ul id="filterCats"></ul></div>
          <div class="filter-group"><h3>Price</h3><ul id="filterPrice"></ul></div>
          <div class="filter-group"><h3>Availability</h3><label><input type="checkbox" id="filterStock"> In stock only</label></div>
        </div>
        <div class="filter-foot"><button type="button" id="filterApply" class="btn btn-dark btn-block">Show results</button></div>
      </aside>

      <section aria-label="Products">
        <div class="toolbar">
          <button type="button" id="filterToggle" class="btn btn-ghost filter-toggle">Filters</button>
          <p class="count" id="shopCount" aria-live="polite"></p>
          <div>
            <label class="sr-only" for="sortSelect">Sort by</label>
            <select id="sortSelect">
              <option value="featured">Featured</option>
              <option value="bestselling">Best selling</option>
              <option value="new">Newest first</option>
              <option value="az">Alphabetically, A–Z</option>
              <option value="za">Alphabetically, Z–A</option>
              <option value="price-asc">Price, low to high</option>
              <option value="price-desc">Price, high to low</option>
            </select>
          </div>
        </div>
        <div class="chips" id="activeFilters"></div>
        <div class="grid" id="shopGrid"></div>
        <div class="more-wrap"><button type="button" id="loadMore" class="btn btn-ghost" hidden>Load more</button></div>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
</body>
</html>
