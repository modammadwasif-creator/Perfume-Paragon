<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart | Perfume Paragon</title>
<meta name="description" content="Review the fragrances in your Perfume Paragon cart.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230e0c0a'/%3E%3Cpath d='M12 3l8 9-8 9-8-9z' fill='none' stroke='%23b08d3c' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body data-page="cart">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="container">
    <div class="page-head"><h1 class="h2">Your cart</h1></div>
    <div class="empty" id="cartEmpty" hidden>
      <h2 class="h3">Your cart is empty</h2>
      <p>Discover a fragrance you will love.</p>
      <a class="btn btn-dark" href="shop.html">Continue shopping</a>
    </div>
    <div class="cart-layout" id="cartPageWrap">
      <ul class="cart-lines" id="cartPageList"></ul>
      <aside class="summary" aria-label="Order summary">
        <h2>Order summary</h2>
        <p class="free-note" id="cartFreeNote"></p>
        <div class="sum-row"><span>Subtotal</span><strong id="cartSub">Rs.0</strong></div>
        <div class="sum-row"><span>Delivery</span><strong id="cartShip">Rs.0</strong></div>
        <div class="sum-row sum-total"><span>Total</span><strong id="cartTotal">Rs.0</strong></div>
        <a class="btn btn-gold btn-block" href="checkout.html">Checkout</a>
        <a class="btn btn-ghost btn-block" href="shop.html">Continue shopping</a>
      </aside>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="products.js"></script>
<script src="cart.js"></script>
<script src="main.js"></script>
</body>
</html>
